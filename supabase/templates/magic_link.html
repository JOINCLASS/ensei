<!--
  ログイン用のコードを送るメール。
  色と丸みはアプリと同じ値を使う（#EEEDF4 / #FFFFFF / #221F33 / #6E6A82 / #DCDAE6 / #8E4EC6）。
  メールでは CSS が効かない環境が多いので、table と style 属性で組む。
  Webフォントも読めないので、端末にある丸ゴシックから順に指定する。
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0"
       style="background:#EEEDF4;margin:0;padding:24px 12px;font-family:'Hiragino Maru Gothic ProN','Hiragino Sans','Noto Sans JP',sans-serif">
  <tr><td align="center">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
           style="max-width:420px;background:#FFFFFF;border-radius:14px;overflow:hidden">

      <!-- 上辺の推し色の帯（アプリの旅の見出しと同じ） -->
      <tr><td style="height:8px;background:#8E4EC6;line-height:8px;font-size:0">&nbsp;</td></tr>

      <tr><td style="padding:28px 24px 24px">
        <p style="margin:0 0 4px;font-size:19px;font-weight:bold;color:#221F33;letter-spacing:.02em">手配まとめ</p>
        <p style="margin:0 0 24px;font-size:13px;color:#6E6A82">ログイン用の確認コードです。</p>

        <!-- コード本体 -->
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
               style="background:#EEEDF4;border-radius:12px">
          <tr><td align="center" style="padding:20px 12px">
            <div style="font-size:34px;font-weight:bold;color:#221F33;letter-spacing:.34em;
                        font-variant-numeric:tabular-nums;text-indent:.34em">{{ .Token }}</div>
          </td></tr>
        </table>

        <p style="margin:20px 0 0;font-size:13px;color:#221F33;line-height:1.8">
          アプリの画面にこの6桁を入れると、ログインできます。
        </p>
        <p style="margin:8px 0 0;font-size:13px;color:#6E6A82;line-height:1.8">
          このコードは1時間で使えなくなります。
        </p>

        <hr style="border:none;border-top:1px solid #DCDAE6;margin:22px 0 0">
        <p style="margin:16px 0 0;font-size:12px;color:#6E6A82;line-height:1.7">
          心当たりがないときは、このメールを捨ててください。
          コードを他の人に教えないでください。
        </p>
      </td></tr>
    </table>

    <p style="margin:16px 0 0;font-size:11px;color:#6E6A82">
      手配まとめ　<a href="https://tehaimatome.com" style="color:#6E6A82">tehaimatome.com</a>
    </p>
  </td></tr>
</table>
