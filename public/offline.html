<!doctype html>
<meta charset="utf-8">
<title>手配まとめ</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EFF2FB">
<style>
  :root{--bg:#EFF2FB;--paper:#FFFFFF;--ink:#1B214B;--muted:#5F6485;--line:#DBE2F0}
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--ink);min-height:100vh;
    font-family:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Hiragino Sans','Noto Sans JP',system-ui,sans-serif;
    font-weight:500}
  main{max-width:480px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px 48px}
  h1{font-size:24px;font-weight:900;margin:8px 0 6px;letter-spacing:.02em}
  section{background:var(--paper);border-radius:16px;padding:32px 20px;text-align:center;
    box-shadow:0 2px 10px rgba(27,33,75,.05);margin-top:20px}
  p{margin:0 0 20px;line-height:1.8;color:var(--muted);font-size:14px}
  button{border:none;border-radius:999px;padding:13px 16px;font:inherit;font-weight:700;
    background:var(--ink);color:#fff;font-size:15px}
</style>
<main>
  <h1>手配まとめ</h1>
  <section>
    <p>
      電波が届いていないようです。<br>
      つながるところで、もう一度お試しください。
    </p>
    <p>
      入力した内容は消えていません。<br>
      サーバーに残っています。
    </p>
    <button onclick="location.reload()">もう一度読み込む</button>
  </section>
</main>
